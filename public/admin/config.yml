# Fresh Muse — Decap CMS dashboard configuration (served publicly at /admin/config.yml).
#
# SECURITY: this file is public. It must NEVER contain a secret — no tokens, no
# client secrets. Authentication is delegated to the OAuth proxy below, which is
# the only place the GitHub OAuth client secret exists.

backend:
  name: github
  repo: freshmuseart/Fresh-Muse-
  branch: main
  # PROXY URL of the Cloudflare Worker OAuth proxy (see cloudflare-worker/README.md).
  # Login cannot work until this matches the deployed worker URL.
  base_url: https://freshmuse-decap-auth.CHANGE-ME.workers.dev
  auth_endpoint: /auth

# Images uploaded in the dashboard are committed to the repository under
# public/images/ and served from /images/… on the website.
media_folder: public/images
public_folder: /images

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: src/content/articles
    create: true
    extension: md
    format: frontmatter
    # URL slug is derived from the title, matching /articles/<slug>/
    slug: "{{slug}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Shown as the article headline and in the browser tab."
      - label: Description
        name: description
        widget: text
        hint: "One or two sentences — shown on cards, section pages and search results."
      - label: Category
        name: category
        widget: select
        options:
          - { label: Art You Almost Missed, value: art-you-almost-missed }
          - { label: Art × Interior, value: art-interior }
          - { label: Artists, value: artists }
          - { label: Collectible Objects, value: collectible-objects }
          - { label: Art History, value: art-history }
        default: art-you-almost-missed
        hint: "Must match a section that exists on the site."
      - label: Publish Date
        name: date
        widget: date
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Ordering on the homepage and section pages follows this date."
      - label: Author
        name: author
        widget: string
        default: "Fresh Muse"
        required: false
      - label: Featured
        name: featured
        widget: boolean
        default: false
        hint: "Shows the article in the featured row on the homepage."
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: "Turn ON to hide the article from the website while you write."
      - label: Body
        name: body
        widget: markdown
        hint: "Markdown. Headings, links, lists, blockquotes and images ( /images/… ) are supported."

  # Curated items — the pieces shown on /shop/ ("Collections"). Fresh Muse
  # never sells directly: every item links out to a retailer, often with an
  # affiliate tracking parameter that is copied through exactly as written.
  - name: products
    label: Curated Items
    label_singular: Curated Item
    folder: src/content/products
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: ["title", "category", "collection", "published"]
    # Item photos uploaded here are committed to the repository and served
    # from /images/products/… on the website. Nothing private is ever stored.
    media_folder: public/images/products
    public_folder: /images/products
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Shown on the card and in the browser tab."
      - label: Description
        name: description
        widget: text
        hint: "One or two sentences shown on the card."
      - label: Price
        name: price
        widget: string
        required: false
        hint: "Optional, display only — written exactly as it should appear, e.g. $18, €24. Leave empty to show no price. The retailer's page is the source of truth."
      - label: Category
        name: category
        widget: select
        options:
          - { label: Prints & Editions, value: prints-editions }
          - { label: Books & Zines, value: books-zines }
          - { label: Objects, value: objects }
          - { label: Digital Downloads, value: digital }
        default: prints-editions
        hint: "Must match a category listed in src/data/products.ts."
      - label: Image
        name: image
        widget: image
        required: false
        hint: "Optional. Without one, generated art is shown for this item."
      - label: Retailer link
        name: url
        widget: string
        pattern:
          - "^https://.+"
          - "Must be a full https:// link — the retailer's own product page, copied exactly."
        hint: "Where the piece can be seen or bought — the retailer's product page. Copy the full URL including any affiliate tracking parameters; it is published verbatim. Payments and delivery happen at the retailer, never on this site."
      - label: Link text
        name: link_label
        widget: string
        required: false
        default: "View at retailer"
        hint: "Button text on the card. Suggested: 'View at retailer' or 'Discover the piece'."
      - label: Affiliate link
        name: sponsored
        widget: boolean
        default: true
        hint: "ON adds rel=\"sponsored\" to the link and an 'Affiliate link' label to the card. Keep ON for any link where Fresh Muse earns a commission."
      - label: Collection
        name: collection
        widget: string
        required: false
        hint: "Optional moodboard — the file name of an entry in the Moodboards collection (e.g. example-moodboard). Leave empty to list the item under 'Curated finds'."
      - label: Published
        name: published
        widget: boolean
        default: false
        hint: "ON = visible on /shop/. OFF = kept in the repository, hidden from the site."
      - label: Body
        name: body
        widget: markdown
        required: false
        hint: "Optional longer copy. Not shown on the card."

  # Moodboards — the groupings shown on /shop/ ("Collections"). Curated items
  # join a moodboard through their Collection field.
  - name: collections
    label: Moodboards
    label_singular: Moodboard
    folder: src/content/collections
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: ["title", "published"]
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Heading of the moodboard on /shop/."
      - label: Tagline
        name: tagline
        widget: string
        required: false
        hint: "Optional one-line promise shown under the title."
      - label: Published
        name: published
        widget: boolean
        default: false
        hint: "ON = the moodboard (and its items) appear on /shop/. OFF = hidden from the site."
      - label: Body
        name: body
        widget: markdown
        required: false
        hint: "Optional intro copy for the moodboard — markdown is supported."

  # ---------------------------------------------------------------------
  # Exhibition — the 3D show at /exhibition/.
  # Settings (title, intro, layout, lighting, spacing), then the rooms and
  # the artworks that hang in them. Nothing here is ever deleted from the
  # repository — turning Published off only hides the piece from the show.
  # ---------------------------------------------------------------------
  - name: exhibition-settings
    label: Exhibition Settings
    files:
      - name: settings
        label: Exhibition
        file: src/content/exhibition/settings.md
        fields:
          - label: Title
            name: title
            widget: string
            hint: "Title of the exhibition — shown on the entry screen and the browser tab."
          - label: Introduction
            name: intro
            widget: text
            hint: "One or two sentences shown on the entry screen before visitors walk in."
          - label: How to visit
            name: how_to
            widget: text
            required: false
            hint: "Controls help shown under the introduction (keyboard, mouse and touch)."
          - label: Room layout
            name: layout
            widget: select
            options:
              - { label: "Enfilade — rooms in a straight line", value: enfilade }
              - { label: "Atrium — central hall with side rooms", value: atrium }
            default: enfilade
            hint: "How the rooms are arranged on the floor plan."
          - label: Lighting
            name: lighting
            widget: select
            options:
              - { label: "Nocturne — dark rooms, warm picture lights", value: nocturne }
              - { label: "Dawn — cooler, softly lit", value: dawn }
              - { label: "White cube — even gallery light", value: white-cube }
            default: nocturne
            hint: "Mood preset for the whole exhibition."
          - label: Artwork spacing
            name: spacing
            widget: number
            value_type: float
            min: 0.6
            max: 2
            step: 0.1
            default: 1
            hint: "Spread works further apart (above 1) or closer together (below 1)."

  - name: exhibition-rooms
    label: Exhibition Rooms
    label_singular: Room
    folder: src/content/exhibition/rooms
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: ["order", "title"]
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Room name — shown on the plaque when a visitor enters."
      - label: Description
        name: description
        widget: text
        hint: "One or two sentences about the room, shown when visitors step inside."
      - label: Order
        name: order
        widget: number
        value_type: int
        default: 1
        hint: "1 is the first room visitors walk into."
      - label: Published
        name: published
        widget: boolean
        default: true
        hint: "OFF hides the room — artworks assigned to it are hidden too."

  - name: exhibition-artworks
    label: Exhibition Artworks
    label_singular: Artwork
    folder: src/content/exhibition/artworks
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: ["room", "order", "title"]
    # Artwork images uploaded here are committed to the repository and
    # served from /images/exhibition/… on the website.
    media_folder: public/images/exhibition
    public_folder: /images/exhibition
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Title of the work, shown on the wall label."
      - label: Artist
        name: artist
        widget: string
        hint: "Who made it — shown under the title on the wall label."
      - label: Description
        name: description
        widget: text
        hint: "One or two sentences shown when a visitor opens the work."
      - label: Room
        name: room
        widget: relation
        collection: exhibition-rooms
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        hint: "Which room the work hangs in."
      - label: Order
        name: order
        widget: number
        value_type: int
        default: 1
        hint: "Hang order within the room — lower numbers hang first."
      - label: Image
        name: image
        widget: image
        required: false
        hint: "Optional. Leave empty and a generated Fresh Muse placeholder is hung in its place."
      - label: Link
        name: link
        widget: string
        required: false
        pattern:
          - "^$|^https://.+"
          - "Leave empty, or use a full https:// link (published exactly as written)."
        hint: "Optional external page about the work — its own page, the artist's site, a museum."
      - label: Link text
        name: link_label
        widget: string
        required: false
        default: "Read more"
        hint: "Button text for the link above."
      - label: Published
        name: published
        widget: boolean
        default: false
        hint: "ON = hung in the show. OFF = kept in the repository, hidden from the exhibition."
      - label: Body
        name: body
        widget: markdown
        required: false
        hint: "Optional longer wall-label copy. Markdown is supported."
